name: analyze

on:
  push:
  pull_request:

jobs:
  layer_lint_test:
    name: layer_lint (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/layer_lint
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.4
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  example_analyze:
    name: example (flutter analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.6
      - run: flutter pub get
      # layer_lint の違反（error）があれば失敗する
      - run: flutter analyze
